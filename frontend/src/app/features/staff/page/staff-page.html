<app-header />
<main class="page">
  <div class="head">
    <div>
      <h1>Staff</h1>
      <p class="lead">
        Close rooms and take slots. Students are told when their booking is cancelled.
      </p>
    </div>
  </div>
  <app-closures-panel
    [closures]="closures()"
    [affected]="affected()"
    [busy]="closureBusy()"
    [message]="closureMessage()"
    [error]="closureError()"
    (edited)="forgetPreview()"
    (previewRequested)="preview($event)"
    (closeRequested)="close($event)"
    (reopenRequested)="askToReopen($event)"
  />
  <app-override-panel
    [holders]="holders()"
    [busy]="overrideBusy()"
    [message]="overrideMessage()"
    [error]="overrideError()"
    (edited)="forgetCheck()"
    (checkRequested)="check($event)"
    (takeRequested)="take($event)"
  />
</main>
