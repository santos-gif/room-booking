<section class="card controls" aria-label="Date and room">
  <div class="field">
    <label for="booking-date">Date</label>
    <!-- Read-only: a typed weekend date would bypass the weekday filter, so dates are picked from the calendar. -->
    <div class="date-field">
      <input
        id="booking-date"
        name="booking-date"
        class="input date-text"
        readonly
        [disabled]="disabled()"
        [matDatepicker]="calendar"
        [matDatepickerFilter]="weekdaysOnly"
        [value]="selected()"
        [min]="minDate"
        [max]="maxDate"
        (click)="calendar.open()"
        (dateChange)="pick($event)"
      />
      <mat-datepicker-toggle [for]="calendar" [disabled]="disabled()" />
      <mat-datepicker #calendar />
    </div>
  </div>

  <fieldset class="field rooms" [disabled]="disabled()">
    <legend>Room</legend>
    <div class="segmented">
      @for (number of rooms; track number) {
        <label>
          <input
            type="radio"
            name="room"
            [value]="number"
            [checked]="room() === number"
            (change)="roomChange.emit(number)"
          />
          <span>Discussion Room {{ number }}</span>
        </label>
      }
    </div>
  </fieldset>
</section>
