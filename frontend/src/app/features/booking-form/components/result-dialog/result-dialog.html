<div class="modal-backdrop">
  <section
    class="modal card"
    role="dialog"
    aria-modal="true"
    aria-label="Booking result"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown.escape)="closed.emit()"
  >
    <p>{{ message() }}</p>
    <div class="actions">
      @if (reconnectNeeded()) {
        <button type="button" class="btn" (click)="reconnect.emit()">
          Reconnect Google Calendar
        </button>
      }
      <button type="button" class="btn btn-primary" cdkFocusInitial (click)="closed.emit()">
        Continue
      </button>
    </div>
  </section>
</div>
