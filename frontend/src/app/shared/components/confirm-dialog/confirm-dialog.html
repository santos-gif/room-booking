<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
	<button type="button" class="btn" [mat-dialog-close]="false">{{ data.cancelLabel }}</button>
	<button type="button" class="btn btn-danger-solid" [mat-dialog-close]="true" cdkFocusInitial>
		{{ data.confirmLabel }}
	</button>
</mat-dialog-actions>
